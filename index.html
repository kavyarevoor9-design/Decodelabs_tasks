<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DecodeLabs – Intern Manager (Project 4)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🧠 Intern Manager</h1>
    <p>Frontend &amp; Backend Integration – DecodeLabs Project 4</p>
  </header>

  <main>
    <!-- Controls -->
    <section class="card controls">
      <button id="loadBtn">Load Interns</button>
      <button id="dashboardBtn" class="secondary">Load Dashboard (parallel)</button>
      <button id="brokenBtn" class="danger">Simulate Server Error</button>
      <input type="search" id="searchInput" placeholder="Search name or role…" />
    </section>

    <!-- Status area: loading spinner + error banner -->
    <div id="spinner" class="spinner hidden" aria-label="Loading"></div>
    <div id="message" class="message hidden" role="alert">
      <span id="messageText"></span>
      <button id="retryBtn" class="hidden">Retry</button>
    </div>

    <!-- Stats -->
    <section id="stats" class="stats hidden"></section>

    <!-- Add intern form (POST) -->
    <section class="card">
      <h2>Register New Intern</h2>
      <form id="internForm" novalidate>
        <input name="name" placeholder="Full name" required />
        <input name="email" type="email" placeholder="Email" required />
        <input name="role" placeholder="Role (e.g. Frontend Intern)" required />
        <input name="contact" placeholder="10-digit contact number" required />
        <button type="submit">Add Intern</button>
      </form>
    </section>

    <!-- Interns list (dynamic data injected here) -->
    <section>
      <h2>Interns</h2>
      <div id="internList" class="grid"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
